spring.application.name=montadora
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database
# Quando a API está em um container e o SQL Server está no host,
# use host.docker.internal como DB_SERVER_URL.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:host.docker.internal}:${DB_SERVER_PORT:1433};databaseName=api;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD:1q2w3e4R@}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect