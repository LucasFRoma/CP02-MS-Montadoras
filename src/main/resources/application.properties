spring.application.name=montadora

server.port=8080
springdoc.swagger-ui.path=/

# Profile "default": usado para desenvolvimento local.
# Pode ser sobrescrito por variaveis de ambiente (mesmos nomes usados no profile prd).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root_pwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

logging.level.org.hibernate.SQL=debug
